name: Deploy

# Every push to dev builds the site and publishes public/ to the master branch,
# which GitHub Pages serves (Settings > Pages > Deploy from branch: master).
# Never targets `main` (that branch belongs to another project's deploys).
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GATSBY_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GATSBY_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Smoke check build output
        run: |
          test -f public/index.html
          test -f public/sitemap.xml
          grep -q "Lead AI Platform Engineer" public/index.html
          test -f public/case-studies/scrubs-copilot/index.html
      - name: Publish to master
        run: |
          touch public/.nojekyll
          npx gh-pages -d public -b master --dotfiles \
            -m "Deploy ${GITHUB_SHA::7} from dev" \
            -u "github-actions <github-actions@users.noreply.github.com>" \
            -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
